<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="50%" stop-color="#121217" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    
    <!-- Accent Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Bookmark Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="1.5" />

  <!-- Open Book Silhouette (Clear, high-contrast, perfectly visible at 16x16) -->
  <!-- Left Page -->
  <path d="M14 20 C20 18, 27 19.5, 30 22 L30 48 C27 45.5, 20 44, 14 46 Z" fill="#ffffff" />
  
  <!-- Right Page -->
  <path d="M50 20 C44 18, 37 19.5, 34 22 L34 48 C37 45.5, 44 44, 50 46 Z" fill="#e4e4e7" />

  <!-- Center Spine / Divider -->
  <path d="M30 22 L32 21 L34 22 L34 48 L32 47.5 L30 48 Z" fill="#a1a1aa" />

  <!-- Page Lines Detail (Left Page) -->
  <line x1="18" y1="27" x2="26" y2="28.5" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="18" y1="33" x2="26" y2="34.5" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="18" y1="39" x2="24" y2="40.2" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

  <!-- Page Lines Detail (Right Page) -->
  <line x1="38" y1="28.5" x2="46" y2="27" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="38" y1="34.5" x2="46" y2="33" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="38" y1="40.2" x2="44" y2="39" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

  <!-- Crimson Bookmark Ribbon hanging from center -->
  <polygon points="30,22 34,22 34,36 32,34 30,36" fill="url(#ribbonGrad)" />

  <!-- Smart / AI 4-Point Sparkle in top right corner representing "Inteligente" -->
  <path d="M48 10 C48 14, 52 14, 52 14 C52 14, 48 14, 48 18 C48 14, 44 14, 44 14 C44 14, 48 14, 48 10 Z" fill="url(#sparkleGrad)" filter="drop-shadow(0px 0px 2px rgba(251, 191, 36, 0.8))" />
  <circle cx="48" cy="14" r="1" fill="#fff" />
</svg>
